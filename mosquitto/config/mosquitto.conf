# Mosquitto broker — telemetry Smart Home (mobile-backend)
# Mount ro vào /mosquitto/config/mosquitto.conf (xem docker-compose.yml).

listener 1883 0.0.0.0
allow_anonymous false
# Passwd được scripts/mosquitto-setup.sh sinh lúc container start
# từ MQTT_USER/MQTT_PASSWORD (không commit passwd vào repo).
password_file /mosquitto/data/passwd

# M10 — listener WebSocket cho app mobile (contract frontend <prefix>/room/{roomId}/...).
# Cùng password_file như 1883 (khai báo toàn cục ở trên không lặp lại ở listener —
# mosquitto từ chối duplicate password_file): user `app` (do mosquitto-setup.sh sinh)
# dùng port này.
listener 9001 0.0.0.0
protocol websockets
allow_anonymous false

persistence true
persistence_location /mosquitto/data/

user mosquitto

log_dest stdout
